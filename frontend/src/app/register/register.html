<div class="min-h-screen bg-[#0d0f14] flex items-center justify-center p-6 relative overflow-hidden">
  <!-- Animated Background Glows -->
  <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-cyan-500/10 blur-[120px] rounded-full"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-500/10 blur-[120px] rounded-full"></div>

  <div class="w-full max-w-md bg-[#1e222d] rounded-[32px] border border-white/10 p-10 shadow-2xl relative z-10 backdrop-blur-xl">
    <div class="text-center mb-10">
      <h1 class="text-3xl font-black text-white tracking-widest uppercase italic mb-2">TradeIntel<span class="text-cyan-500">AI</span></h1>
      <p class="text-[10px] font-black uppercase tracking-[0.4em] text-cyan-500/50">Neural Arbitrage Registration</p>
    </div>

    @if (step() === 1) {
      <div class="space-y-6">
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Full Identity</label>
          <input [(ngModel)]="user.fullname" type="text" placeholder="John Doe" 
                 class="w-full bg-black/30 border border-white/5 rounded-xl px-5 py-4 text-sm text-white focus:outline-none focus:border-cyan-500/50 transition-all font-bold">
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Digital Mail</label>
          <input [(ngModel)]="user.email" type="email" placeholder="john@tradeintel.ai" 
                 class="w-full bg-black/30 border border-white/5 rounded-xl px-5 py-4 text-sm text-white focus:outline-none focus:border-cyan-500/50 transition-all font-bold">
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Priority Key (Password)</label>
          <input type="password" placeholder="••••••••" 
                 class="w-full bg-black/30 border border-white/5 rounded-xl px-5 py-4 text-sm text-white focus:outline-none focus:border-cyan-500/50 transition-all font-bold">
        </div>
      </div>
    } @else {
      <div class="space-y-6 animate-in slide-in-from-right duration-500">
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Initial Capital (INR)</label>
          <div class="relative">
            <span class="absolute left-5 top-1/2 -translate-y-1/2 text-cyan-500 font-bold">₹</span>
            <input [(ngModel)]="user.capital" type="number" 
                   class="w-full bg-black/30 border border-white/5 rounded-xl pl-10 pr-5 py-4 text-sm text-white focus:outline-none focus:border-cyan-500/50 transition-all font-bold">
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Market Exposure</label>
          <select [(ngModel)]="user.experience" class="w-full bg-black/30 border border-white/5 rounded-xl px-5 py-4 text-sm text-white focus:outline-none focus:border-cyan-500/50 transition-all font-bold appearance-none">
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Professional</option>
            <option>Institutional</option>
          </select>
        </div>
      </div>
    }

    <div class="mt-10 space-y-4">
      <button (click)="nextStep()" 
              class="w-full bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 text-white py-4 rounded-2xl text-[11px] font-black uppercase tracking-[0.3em] shadow-lg shadow-cyan-900/20 transition-all flex items-center justify-center gap-2">
        @if (isLoading()) {
          <div class="w-4 h-4 border-2 border-white/10 border-t-white rounded-full animate-spin"></div>
          Synchronizing...
        } @else {
          {{ step() === 1 ? 'Next Phase' : 'Activate Account' }}
        }
      </button>
      
      <p class="text-[10px] text-center text-slate-600 font-bold uppercase tracking-widest">
        Already registered? <a routerLink="/dashboard" class="text-cyan-500">Access Terminal</a>
      </p>
    </div>
  </div>
</div>
